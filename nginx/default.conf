# ── HTTP → редирект на HTTPS ─────────────────────────────────────────────────
server {
    listen 80;
    server_name snzbeachvolleyball25.ru;

    # Certbot использует этот путь для проверки домена при выдаче сертификата
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS → проксирование в Go приложение ────────────────────────────────────
server {
    listen 443 ssl;
    server_name snzbeachvolleyball25.ru;

    # Пути к SSL сертификатам (выдаёт Certbot / Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/snzbeachvolleyball25.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snzbeachvolleyball25.ru/privkey.pem;

    location / {
        # Передаём запросы в контейнер app на порт 8080
        # "app" — это имя сервиса в docker-compose.yml, Docker резолвит его сам
        proxy_pass http://app:8080;

        # Передаём оригинальные заголовки (нужно для логов и Telegram webhook)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
